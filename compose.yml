services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: jamin8r
      POSTGRES_USER: jamin8r
      POSTGRES_PASSWORD: jamin8r
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jamin8r -d jamin8r"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - jamin8r_postgres:/var/lib/postgresql/data

volumes:
  jamin8r_postgres:
