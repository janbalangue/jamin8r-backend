spring:
  application:
    name: jamin8r-backend
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${JAMIN8R_DB_URL:jdbc:postgresql://localhost:5432/jamin8r}
    username: ${JAMIN8R_DB_USERNAME:jamin8r}
    password: ${JAMIN8R_DB_PASSWORD:jamin8r}
    hikari:
      maximum-pool-size: ${JAMIN8R_DB_MAX_POOL_SIZE:20}
      minimum-idle: ${JAMIN8R_DB_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jamin8r:
  outbox:
    dispatch:
      enabled: ${JAMIN8R_OUTBOX_DISPATCH_ENABLED:false}
      batch-size: ${JAMIN8R_OUTBOX_BATCH_SIZE:50}
      fixed-delay-ms: ${JAMIN8R_OUTBOX_FIXED_DELAY_MS:1000}
